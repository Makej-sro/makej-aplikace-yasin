name: Deploy to GitHub Pages

# Po každém pushi do main nasadí složku www/ na GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:   # umožní spustit ručně z karty Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Ať se nasazuje po jednom, nový push zruší rozdělané.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Nahraj www/ jako artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./www
      - name: Nasaď na Pages
        id: deployment
        uses: actions/deploy-pages@v4
